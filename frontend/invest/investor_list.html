<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>产品列表公示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 24px; }
    h1 { font-size: 22px; margin-bottom: 20px; color: #333; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e8e8e8; }
    th { background: #fafafa; font-weight: 600; color: #666; }
    tr:hover { background: #f5f5f5; cursor: pointer; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .tag-green { background: #e8f5e9; color: #2e7d32; }
    .tag-red { background: #ffebee; color: #c62828; }
    .tag-yellow { background: #fff8e1; color: #f57f17; }
    .tag-gray { background: #f5f5f5; color: #757575; }
    .risk-tip { margin-top: 20px; padding: 12px; background: #fff3e0; border-radius: 4px; font-size: 12px; color: #e65100; }
    #loading { text-align: center; padding: 40px; color: #999; }
  </style>
</head>
<body>
<div class="container">
  <h1>场外挂钩结构化产品列表公示</h1>
  <div id="loading">加载中...</div>
  <table id="productTable" style="display:none">
    <thead>
      <tr>
        <th>产品代码</th>
        <th>产品名称</th>
        <th>结构类型</th>
        <th>挂钩标的</th>
        <th>标的现价</th>
        <th>成立日</th>
        <th>到期日</th>
        <th>估算基准</th>
        <th>最终基准</th>
        <th>状态</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="risk-tip">
    风险提示：估算基准仅为模型理论测算值，不构成任何收益承诺；最终兑付结果以产品合同约定及托管机构清算为准。
  </div>
</div>

<script type="module">
  import {
    getProductStatusInfo,
    formatPercentShow,
    formatPriceShow,
    getEstimatedDisplay,
    formatUnderlying,
    formatProductName
  } from "../../backend/common.util.js";
  import { TYPE_LABEL } from "../../backend/constant.js";

  let productsData = { products: [], underlyings: {} };
  let prices = {};
  let initialPrices = {};

  // 获取标的akshare代码
  function getUnderlyingCode(name) {
    if (productsData.underlyings[name]?.code) return productsData.underlyings[name].code;
    return null;
  }

  // 加载数据
  async function loadData() {
    try {
      // 加载产品数据
      const prodResp = await fetch('../../backend/products.json?t=' + Date.now());
      if (prodResp.ok) {
        productsData = await prodResp.json();
      }

      // 加载当前价格
      const priceResp = await fetch('../../backend/prices.json?t=' + Date.now());
      if (priceResp.ok) {
        prices = await priceResp.json();
      }

      // 加载期初价格
      const initResp = await fetch('../../backend/initial_prices.json?t=' + Date.now());
      if (initResp.ok) {
        initialPrices = await initResp.json();
      }
    } catch(e) {
      console.warn('加载数据失败:', e);
    }
  }

  // 渲染列表
  function renderTable() {
    const tbody = document.getElementById('tableBody');
    const today = new Date().toISOString().split('T')[0];
    
    tbody.innerHTML = '';
    
    productsData.products.forEach(prod => {
      // 更新当前价格
      const code = getUnderlyingCode(prod.underlying);
      if (code && prices[code]?.price) {
        prod.underlying_price = prices[code].price;
      }
      
      // 更新期初价格
      if (initialPrices[prod.product_code]?.price) {
        prod.initial_price = initialPrices[prod.product_code].price;
      }
      
      const statusObj = getProductStatusInfo(prod, today);
      const tr = document.createElement('tr');
      tr.onclick = () => {
        window.location.href = `investor_view.html?code=${prod.product_code}`;
      };
      tr.innerHTML = `
        <td>${prod.product_code}</td>
        <td>${formatProductName(prod.product_name)}</td>
        <td>${TYPE_LABEL[prod.product_type] || '--'}</td>
        <td>${formatUnderlying(prod.underlying)}</td>
        <td>${formatPriceShow(prod.underlying_price)}</td>
        <td>${prod.establish_date || '--'}</td>
        <td>${prod.contract_maturity_date || '--'}</td>
        <td>${getEstimatedDisplay(prod)}</td>
        <td>${formatPercentShow(prod.performance_base)}</td>
        <td><span class="${statusObj.className}">${statusObj.text}</span></td>
      `;
      tbody.appendChild(tr);
    });
    
    document.getElementById('loading').style.display = 'none';
    document.getElementById('productTable').style.display = 'table';
  }

  // 初始化
  await loadData();
  renderTable();
</script>
</body>
</html>
